<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <!-- Beer amber gradient -->
    <linearGradient id="beer" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <!-- Glass shine -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="white" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Foam gradient -->
    <linearGradient id="foam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="40%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Subtle radial glow behind glass -->
  <circle cx="64" cy="65" r="40" fill="white" opacity="0.08"/>

  <g filter="url(#shadow)">
    <!-- Pint glass body (tapered, centered) -->
    <path d="M44 36 L40 96 C40 100, 44 104, 50 104 L78 104 C84 104, 88 100, 88 96 L84 36 Z" fill="url(#beer)" opacity="0.95"/>

    <!-- Glass rim -->
    <path d="M42 36 L86 36" stroke="white" stroke-width="1.5" opacity="0.6" stroke-linecap="round"/>

    <!-- Glass shine reflection -->
    <path d="M46 38 L43 96 C43 98, 45 100, 48 100 L52 100 C50 98, 49 96, 50 38 Z" fill="url(#shine)"/>

    <!-- Rising bubbles -->
    <circle cx="56" cy="82" r="1.5" fill="white" opacity="0.4"/>
    <circle cx="64" cy="74" r="1.2" fill="white" opacity="0.35"/>
    <circle cx="60" cy="66" r="1.8" fill="white" opacity="0.3"/>
    <circle cx="70" cy="78" r="1" fill="white" opacity="0.35"/>
    <circle cx="52" cy="70" r="1.3" fill="white" opacity="0.25"/>
    <circle cx="74" cy="86" r="1.4" fill="white" opacity="0.3"/>
    <circle cx="66" cy="58" r="1" fill="white" opacity="0.2"/>

    <!-- Foam layer -->
    <path d="M44 36 L84 36 L84 42 C84 42, 80 46, 74 44 C68 42, 66 46, 62 46 C58 46, 56 42, 52 44 C48 46, 44 42, 44 42 Z" fill="url(#foam)" opacity="0.95"/>

    <!-- Foam top bubbles -->
    <circle cx="50" cy="34" r="5" fill="white" opacity="0.9"/>
    <circle cx="60" cy="31" r="6.5" fill="white" opacity="0.92"/>
    <circle cx="72" cy="32" r="5.5" fill="white" opacity="0.88"/>
    <circle cx="80" cy="35" r="4" fill="white" opacity="0.85"/>
    <circle cx="55" cy="28" r="4" fill="white" opacity="0.8"/>
    <circle cx="66" cy="26" r="5" fill="white" opacity="0.85"/>
    <circle cx="76" cy="29" r="3.5" fill="white" opacity="0.78"/>
    <circle cx="46" cy="32" r="3" fill="white" opacity="0.75"/>

    <!-- Mug handle -->
    <path d="M88 44 C96 44, 104 50, 104 62 C104 74, 96 82, 88 82" stroke="white" stroke-width="5.5" fill="none" stroke-linecap="round" opacity="0.9"/>
    <path d="M88 44 C96 44, 104 50, 104 62 C104 74, 96 82, 88 82" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- TS badge on glass -->
  <rect x="51" y="60" width="26" height="18" rx="3" fill="url(#bg)" opacity="0.85"/>
  <text x="64" y="74" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" fill="white" letter-spacing="1">TS</text>

  <!-- Sparkle effects -->
  <g filter="url(#glow)">
    <circle cx="98" cy="38" r="1.5" fill="white" opacity="0.9"/>
    <line x1="98" y1="34" x2="98" y2="42" stroke="white" stroke-width="0.8" opacity="0.7"/>
    <line x1="94" y1="38" x2="102" y2="38" stroke="white" stroke-width="0.8" opacity="0.7"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="34" cy="52" r="1" fill="white" opacity="0.7"/>
    <line x1="34" y1="49" x2="34" y2="55" stroke="white" stroke-width="0.6" opacity="0.5"/>
    <line x1="31" y1="52" x2="37" y2="52" stroke="white" stroke-width="0.6" opacity="0.5"/>
  </g>

  <!-- PUB text centered -->
  <text x="64" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="white" opacity="0.7" letter-spacing="3">PUB</text>
</svg>
