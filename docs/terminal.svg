<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320">
  <style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes typewriter1 {
      0%, 5% { width: 0; }
      15%, 100% { width: 180px; }
    }
    @keyframes typewriter2 {
      0%, 20% { width: 0; opacity: 0; }
      21% { opacity: 1; }
      35%, 100% { width: 350px; }
    }
    @keyframes typewriter3 {
      0%, 40% { width: 0; opacity: 0; }
      41% { opacity: 1; }
      55%, 100% { width: 300px; }
    }
    @keyframes typewriter4 {
      0%, 60% { width: 0; opacity: 0; }
      61% { opacity: 1; }
      75%, 100% { width: 140px; }
    }
    @keyframes fadeIn1 { 0%, 35% { opacity: 0; } 40%, 100% { opacity: 1; } }
    @keyframes fadeIn2 { 0%, 55% { opacity: 0; } 60%, 100% { opacity: 1; } }
    @keyframes fadeIn3 { 0%, 75% { opacity: 0; } 80%, 100% { opacity: 1; } }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .window { fill: #1a1b26; }
    .titlebar { fill: #24283b; }
    .btn-red { fill: #f7768e; }
    .btn-yellow { fill: #e0af68; }
    .btn-green { fill: #9ece6a; }
    .prompt { fill: #7aa2f7; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
    .command { fill: #c0caf5; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 13px; }
    .error { fill: #f7768e; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
    .success { fill: #9ece6a; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
    .dim { fill: #565f89; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 12px; }
    .cursor {
      fill: #c0caf5;
      animation: blink 1s step-end infinite;
    }
    .line1 { animation: typewriter1 8s steps(20) infinite; overflow: hidden; white-space: nowrap; }
    .line2 { animation: typewriter2 8s steps(40) infinite; overflow: hidden; white-space: nowrap; }
    .line3 { animation: typewriter3 8s steps(35) infinite; overflow: hidden; white-space: nowrap; }
    .line4 { animation: typewriter4 8s steps(15) infinite; overflow: hidden; white-space: nowrap; }
    .output1 { animation: fadeIn1 8s infinite; }
    .output2 { animation: fadeIn2 8s infinite; }
    .output3 { animation: fadeIn3 8s infinite; }
    .glow {
      filter: drop-shadow(0 0 3px rgba(122, 162, 247, 0.5));
    }
  </style>

  <!-- Window -->
  <rect class="window" x="0" y="0" width="600" height="320" rx="10"/>

  <!-- Title bar -->
  <rect class="titlebar" x="0" y="0" width="600" height="30" rx="10"/>
  <rect class="titlebar" x="0" y="15" width="600" height="15"/>

  <!-- Traffic lights -->
  <circle class="btn-red" cx="20" cy="15" r="6"/>
  <circle class="btn-yellow" cx="40" cy="15" r="6"/>
  <circle class="btn-green" cx="60" cy="15" r="6"/>

  <!-- Title -->
  <text x="300" y="19" text-anchor="middle" fill="#565f89" font-family="system-ui" font-size="12">tspub — terminal</text>

  <!-- Line 1: Command -->
  <g transform="translate(20, 60)">
    <text class="prompt">❯</text>
    <foreignObject x="18" y="-13" width="200" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" class="line1" style="font-family: monospace; font-size: 13px; color: #c0caf5;">npx tspub check</div>
    </foreignObject>
  </g>

  <!-- Output errors -->
  <g class="output1">
    <text class="error" x="20" y="95">✗ exports/types-order</text>
    <text class="dim" x="200" y="95">"types" should be first</text>
  </g>
  <g class="output1">
    <text class="error" x="20" y="115">✗ exports/file-exists</text>
    <text class="dim" x="200" y="115">./dist/index.js missing</text>
  </g>
  <g class="output1">
    <text class="error" x="20" y="135">✗ metadata/license</text>
    <text class="dim" x="200" y="135">no license field</text>
  </g>
  <g class="output1">
    <text class="dim" x="20" y="160">─────────────────────────────────────────</text>
    <text class="error" x="20" y="180">3 errors</text>
    <text class="dim" x="85" y="180">(2 fixable with --fix)</text>
  </g>

  <!-- Line 2: Fix command -->
  <g transform="translate(20, 210)" class="output2">
    <text class="prompt">❯</text>
    <foreignObject x="18" y="-13" width="400" height="20">
      <div xmlns="http://www.w3.org/1999/xhtml" class="line2" style="font-family: monospace; font-size: 13px; color: #c0caf5;">npx tspub check --fix</div>
    </foreignObject>
  </g>

  <!-- Fix output -->
  <g class="output3">
    <text class="success" x="20" y="245">✓ Fixed exports/types-order</text>
    <text class="success" x="20" y="265">✓ Fixed metadata/license</text>
    <text class="dim" x="20" y="290">─────────────────────────────────────────</text>
    <text class="success glow" x="20" y="308">All fixable issues resolved. Ship it.</text>
  </g>
</svg>
